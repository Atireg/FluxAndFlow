<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TODO: your own name/summary here - these are what search engines and
       link previews show, so they are worth writing properly. -->
  <title>Flux and Flow</title>
  <meta name="description" content="A catalog of projects, explored in three dimensions.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600&display=swap">

<body>
  <canvas class="webgl"></canvas>

  <aside class="panel" id="panel" aria-hidden="true">

    <header>

    <div class="panel__body" id="panel-body"></div>

    <p class="panel__credits" id="panel-credits"></p>

    <p class="panel__status" id="panel-status" role="status"></p>
