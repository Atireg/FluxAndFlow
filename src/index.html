<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TODO: your own name/summary here - these are what search engines and
       link previews show, so they are worth writing properly. -->
  <title>Flux and Flow</title>
  <meta name="description" content="A catalog of projects, explored in three dimensions.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Start-up loader: a field of flowing particles - the flux - that picks
       up strength as the catalog loads. As the loader leaves, the field
       stays behind the pebbles, calmer, its streams parting round each one
       (script.js tells it where they are through window.fluxField). Inline, and ahead of everything else, so it's on screen
       before the main script has even downloaded. script.js reports
       progress through window.fluxLoader; see DECISIONS.md. -->
  <div class="loader" id="loader" role="progressbar" aria-label="Loading Flux and Flow"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas class="loader__field" id="loader-field" aria-hidden="true"></canvas>
    <div class="loader__mark">
      <p class="loader__title">Flux <span class="loader__and">and</span> Flow</p>
      <div class="loader__line" aria-hidden="true"><span class="loader__fill" id="loader-fill"></span></div>
      <p class="loader__count" id="loader-count" aria-hidden="true">0%</p>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('loader');
      var canvas = document.getElementById('loader-field');
      var fill = document.getElementById('loader-fill');
      var count = document.getElementById('loader-count');
      var ctx = canvas.getContext('2d');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ms - the loader is an opening, not just a wait: it stays this long
      // however fast the catalog loads, and the bar paces itself to fill over
      // it rather than racing to 100% and sitting there
      var MIN_VISIBLE = 5000;
      // The exit: the loader fades onto the same paper the site sits on while
      // the streams calm down - and stay, behind the pebbles
      var EXIT = 900; // ms - keep in step with .loader.is-leaving in styles.css
      // Once the catalog is up the field drifts on behind it, gentler than
      // while loading: slower, fainter, fewer streams
      var AMBIENT_FLUX = 0.3; // 0..1, as the loading flux
      var AMBIENT_ALPHA = 0.3; // a stream's ink
      var AMBIENT_SHARE = 0.6; // of the streams still drawn
      // Round each pebble the streams part, like a current round stones:
      // within this many of its radii they turn aside, and one that strays
      // inside is eased back out
      var PART_REACH = 1.35;
      var PART_TURN = 0.6; // how much of the inward drift is turned aside each frame
      var SHADES = 8; // steps between a palette's two flow colours

      // "Paper", chosen from six palettes and since carried through the whole
      // site: dark ink streams on a light ground, with touches of the site's
      // orange. Each stream is shaded between
      // `from` and `to` by the direction it's flowing, so the field reads as
      // currents with depth rather than one flat colour.
      var palette = { bg: [240, 237, 230], from: [15, 45, 55], to: [200, 110, 50], ink: '#0e1d24', dim: '#5b6b70' };
      var shades;

      function rgba(c, a) { return 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + a + ')'; }

      function usePalette() {
        shades = [];
        for (var i = 0; i < SHADES; i++) {
          var k = i / (SHADES - 1);
          shades.push([0, 1, 2].map(function (j) { return Math.round(palette.from[j] + (palette.to[j] - palette.from[j]) * k); }));
        }
        root.style.setProperty('--loader-bg', rgba(palette.bg, 1));
        root.style.setProperty('--loader-ink', palette.ink);
        root.style.setProperty('--loader-dim', palette.dim);
        root.style.setProperty('--loader-accent', rgba(palette.from, 1));
        root.style.setProperty('--loader-rule', rgba(palette.from, 0.2));
        ctx.fillStyle = rgba(palette.bg, 1);
        ctx.fillRect(0, 0, width, height);
        if (still) drawStillField();
      }

      var startedAt = performance.now();
      var target = 0; // reported progress, 0..1
      var shown = 0; // eased towards target, so the bar flows rather than jumps
      var lastFrame = null;
      var finishAt = null; // when the exit may start
      var leavingSince = null;
      var ambient = 0; // 0 loading .. 1 behind the catalog
      var obstacles = []; // the pebbles on screen: { x, y, r } in CSS pixels
      var showing = true; // false while a project is open - see fluxField
      var hiddenSince = null;
      var width = 0, height = 0, dpr = 1, particles = [];
      var segments = new Float32Array(0), bins = new Uint8Array(0);

      // The direction the field flows at a point: a few slow, layered waves,
      // drifting over time, so the streams curl and braid like a current
      function angle(x, y, t) {
        return Math.sin(x * 0.0035 + t * 0.00025) * 1.6
             + Math.cos(y * 0.0042 - t * 0.0002) * 1.4
             + Math.sin((x - y) * 0.0018 + t * 0.00012) * 1.1;
      }

      function shadeOf(a) {
        return Math.min(SHADES - 1, Math.floor(((Math.sin(a) + 1) / 2) * SHADES));
      }

      function spawn(p) {
        p.x = Math.random() * width;
        p.y = Math.random() * height;
        p.age = 0;
        p.life = 60 + Math.random() * 140;
        return p;
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var n = Math.min(1200, Math.round((width * height) / 650));
        particles = [];
        for (var i = 0; i < n; i++) {
          var p = spawn({});
          p.age = Math.random() * p.life; // not all born on the same frame
          particles.push(p);
        }
        segments = new Float32Array(n * 4);
        bins = new Uint8Array(n);

        usePalette();
      }

      function step(now) {
        // Eased by time, not per frame, so a slow device doesn't drag it out
        var dt = lastFrame === null ? 16 : Math.min(now - lastFrame, 100);
        lastFrame = now;

        var paced = Math.min(target, (now - startedAt) / MIN_VISIBLE);
        shown += (paced - shown) * (1 - Math.exp(-dt / 180));

        // Hidden behind an open project, it rests once it has faded out
        var resting = !showing && hiddenSince !== null && now - hiddenSince > 1500;
        if (!still && !resting) drawField(now, dt / 16.7);

        var percent = Math.round(shown * 100);
        fill.style.transform = 'scaleX(' + shown + ')';
        count.textContent = percent + '%';
        root.setAttribute('aria-valuenow', percent);

        if (finishAt !== null && leavingSince === null && now >= finishAt && shown > 0.97) {
          leavingSince = now;
          root.classList.add('is-leaving');
          // The field steps out of the loader to stay, under the catalog
          canvas.classList.add('flux-field');
          document.body.insertBefore(canvas, root);
        }

        if (leavingSince !== null) ambient = Math.min((now - leavingSince) / EXIT, 1);

        if (leavingSince !== null && now - leavingSince > EXIT && root.parentNode) root.remove();

        window.requestAnimationFrame(step);
      }

      // frames: how many 60fps frames this one stands for, so the flow moves
      // and fades at the same pace whatever the device's frame rate
      function drawField(now, frames) {
        // Fading the last frame rather than clearing it leaves the trails
        ctx.fillStyle = rgba(palette.bg, (1 - Math.pow(1 - 0.09, frames)).toFixed(3));
        ctx.fillRect(0, 0, width, height);

        // The flow gathers strength as loading goes, then settles to a drift
        var flux = (0.3 + 0.7 * shown) * (1 - ambient) + AMBIENT_FLUX * ambient;
        var drawn = Math.round(particles.length * (1 - (1 - AMBIENT_SHARE) * ambient));

        for (var i = 0; i < drawn; i++) {
          var p = particles[i];
          var a = angle(p.x, p.y, now);
          var speed = (0.5 + 1.7 * flux) * frames;
          var vx = Math.cos(a) * speed;
          var vy = Math.sin(a) * speed;

          // Round the pebbles: the part of the drift heading into one is
          // turned aside, more the closer it is, so the stream slides round
          for (var o = 0; o < obstacles.length; o++) {
            var ob = obstacles[o];
            var dx = p.x - ob.x, dy = p.y - ob.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 1;
            var reach = ob.r * PART_REACH;
            if (d >= reach) continue;
            var nx = dx / d, ny = dy / d;
            var near = 1 - d / reach;
            var inward = vx * nx + vy * ny;
            if (inward < 0) {
              vx -= nx * inward * Math.min(1, near * PART_TURN * 3);
              vy -= ny * inward * Math.min(1, near * PART_TURN * 3);
            }
            if (d < ob.r) {
              vx += nx * speed * near;
              vy += ny * speed * near;
            }
          }

          segments[i * 4] = p.x;
          segments[i * 4 + 1] = p.y;
          segments[i * 4 + 2] = p.x + vx;
          segments[i * 4 + 3] = p.y + vy;
          bins[i] = shadeOf(a);

          p.x += vx;
          p.y += vy;
          p.age += frames;

          if (p.age > p.life || p.x < 0 || p.x > width || p.y < 0 || p.y > height) spawn(p);
        }

        // One stroke per shade, rather than one per particle
        var alpha = (0.18 + 0.42 * flux) * (1 - ambient) + AMBIENT_ALPHA * ambient;
        ctx.lineWidth = 1;
        for (var b = 0; b < SHADES; b++) {
          ctx.beginPath();
          for (var j = 0; j < drawn; j++) {
            if (bins[j] !== b) continue;
            ctx.moveTo(segments[j * 4], segments[j * 4 + 1]);
            ctx.lineTo(segments[j * 4 + 2], segments[j * 4 + 3]);
          }
          ctx.strokeStyle = rgba(shades[b], alpha);
          ctx.stroke();
        }
      }

      // A still screen still says what the page is: a few streamlines drawn
      // once, then only the bar and the count move
      function drawStillField() {
        for (var k = 0; k < 40; k++) {
          for (var j = 0; j < particles.length; j++) {
            var q = particles[j], b = angle(q.x, q.y, 0);
            ctx.beginPath();
            ctx.moveTo(q.x, q.y);
            q.x += Math.cos(b) * 2;
            q.y += Math.sin(b) * 2;
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = rgba(shades[shadeOf(b)], 0.14);
            ctx.stroke();
          }
        }
      }

      // The catalog's side: where the pebbles are, each frame, or null while
      // a project is open - the field fades out then and rests
      window.fluxField = {
        update: function (pebbles) {
          var show = pebbles !== null;
          obstacles = pebbles || [];
          if (show === showing) return;
          showing = show;
          hiddenSince = show ? null : performance.now();
          canvas.classList.toggle('is-hidden', !show);
        },
      };

      window.fluxLoader = {
        progress: function (fraction) {
          target = Math.max(target, Math.min(fraction, 1));
        },
        finish: function () {
          if (finishAt !== null) return;
          target = 1;
          finishAt = Math.max(performance.now(), startedAt + MIN_VISIBLE);
        },
      };

      resize();
      window.addEventListener('resize', resize);

      window.requestAnimationFrame(step);

      // Whatever happens to the rest of the page, never trap the visitor here
      setTimeout(function () { window.fluxLoader.finish(); }, 30000);
    })();
  </script>

  <!-- A grey fog that rolls in behind the scene while a project is open:
       a page layer under the transparent canvas, not three.js fog - see
       DECISIONS.md -->
  <div class="fog" id="fog" aria-hidden="true"></div>

  <canvas class="webgl"></canvas>

  <!-- A touch point that turns up every few seconds over the open model and
       taps twice, hinting that a double-click/double-tap zooms in. Placed
       and started by maybeShowTapHint in script.js. -->
  <div class="tap-hint" id="tap-hint" aria-hidden="true">
    <span class="tap-hint__ripple"></span>
    <span class="tap-hint__ripple tap-hint__ripple--second"></span>
    <span class="tap-hint__dot"></span>
  </div>

  <!-- The answer to clicking a slot with no project in it yet; placed by
       updateCubeTags in script.js for a moment after the click -->
  <div class="cube-tag cube-tag--empty" id="empty-tag" aria-hidden="true">Still empty...</div>
  <!-- The tag's string: a faint glow under a fine line, and a dot where
       it's tied on -->
  <svg class="tag-string" id="spotlight-string" aria-hidden="true">
    <path class="tag-string__glow" />
    <path class="tag-string__line" />
    <circle class="tag-string__knot-glow" />
    <circle class="tag-string__knot" />
  </svg>
  <div class="cube-tag cube-tag--spotlight" id="spotlight-tag" aria-hidden="true"></div>

  <!-- Always on screen while a project is open: just enough to say what you
       are looking at and how to get back -->
  <header class="bar" id="bar" aria-hidden="true">
    <button class="bar__back" id="project-close" type="button">
      <span class="bar__back-arrow" aria-hidden="true">&larr;</span> All projects
    </button>

    <h1 class="bar__title" id="project-title"></h1>
    <p class="bar__status" id="project-status" role="status"></p>
  </header>

  <!-- The description, pulled out from the edge on demand -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer__handle" id="drawer-handle" type="button"
            aria-expanded="false" aria-controls="drawer-content">
      <span class="drawer__pulse" aria-hidden="true"></span>
      <span class="drawer__label">About</span>
      <span class="drawer__chevron" aria-hidden="true">&lsaquo;</span>
    </button>

    <div class="drawer__content" id="drawer-content">
      <!-- Mirrors #project-title; shown only on narrow viewports, where the
           bar's own title hides once the drawer is open (see styles.css) so
           the two don't both eat vertical space at once. -->
      <h2 class="drawer__title" id="drawer-title"></h2>
      <dl class="drawer__meta" id="project-meta"></dl>
      <div class="drawer__body" id="project-body"></div>
      <!-- A project's images - each an empty frame until it has a file -->
      <div class="drawer__images" id="project-images"></div>
      <p class="drawer__credits" id="project-credits"></p>
    </div>
  </aside>

  <script type="module" src="script.js"></script>
</body>
</html>
